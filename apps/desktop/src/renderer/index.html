<!doctype html>
<html lang="zh">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'"
    />
    <title>desktop-agent spike</title>
    <style>
      :root { color-scheme: dark; font-family: ui-monospace, monospace; }
      * { box-sizing: border-box; }
      body { margin: 0; display: grid; grid-template-columns: 280px 1fr; height: 100vh; background: #111418; color: #d7dde3; font-size: 13px; }
      aside { border-right: 1px solid #2a2f36; padding: 12px; overflow-y: auto; }
      main { display: flex; flex-direction: column; overflow: hidden; }
      #log { flex: 1; overflow-y: auto; padding: 16px; white-space: pre-wrap; word-break: break-word; }
      .row { margin: 6px 0; display: flex; gap: 6px; flex-wrap: wrap; }
      button { background: #232a33; color: #d7dde3; border: 1px solid #3a424d; border-radius: 6px; padding: 5px 10px; cursor: pointer; font-size: 12px; }
      button:hover { background: #2c3540; }
      button.primary { background: #2563eb22; border-color: #2563eb88; }
      button.deny { border-color: #b91c1c88; }
      input, select { background: #181c22; color: #d7dde3; border: 1px solid #3a424d; border-radius: 6px; padding: 5px 8px; font-size: 12px; }
      .card { border: 1px solid #b45309; background: #271a05; border-radius: 8px; padding: 10px; margin: 10px 0; }
      .card h4 { margin: 0 0 6px; color: #f59e0b; font-size: 12px; }
      h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: #7d8590; margin: 14px 0 4px; }
      #status { padding: 6px 16px; border-top: 1px solid #2a2f36; color: #7d8590; font-size: 11px; }
      .msg-user { color: #93c5fd; } .msg-assistant { color: #e5e7eb; } .thinking { color: #6b7280; font-style: italic; }
      .tool { color: #a78bfa; }
      code { color: #9ae6b4; }
    </style>
  </head>
  <body>
    <aside>
      <h3>Workspace</h3>
      <div class="row"><button id="openWs">打开目录…</button><button id="closeWs">关闭</button></div>
      <div class="row">
        <button data-trust="restricted">Restricted</button>
        <button data-trust="trusted">Trusted</button>
      </div>
      <div id="wsInfo"></div>

      <h3>Sessions</h3>
      <div class="row">
        <button id="newSession">新建</button>
        <button id="listSessions">刷新</button>
      </div>
      <select id="sessionSelect" size="1" style="width:100%"></select>

      <h3>Auth / Model</h3>
      <div class="row"><button id="authStatus">auth.status</button></div>
      <div id="authInfo"></div>

      <h3>Spike 工具</h3>
      <div class="row">
        <input id="stressCount" value="2000" style="width:70px" />
        <input id="stressSize" value="40" style="width:60px" />
        <button id="stressBtn">压测 delta</button>
      </div>
      <div id="stressStats"></div>
    </aside>

    <main>
      <div id="log"></div>
      <div class="card" id="approvals" style="display:none; margin:0; border-radius:0;"></div>
      <div class="row" style="padding:10px 16px; border-top:1px solid #2a2f36;">
        <input id="promptInput" style="flex:1" placeholder="输入 prompt…（试：读取 package.json 并总结）" />
        <button id="sendBtn" class="primary">发送</button>
        <button id="abortBtn" class="deny">停止</button>
      </div>
      <div id="status">idle</div>
    </main>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
